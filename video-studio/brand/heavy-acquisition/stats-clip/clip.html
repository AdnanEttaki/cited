<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#111;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
:root{--u:min(1vw,1.7778vh)}
.stage{position:absolute;inset:0}
.stripe{position:absolute;left:0;right:0;height:calc(var(--u)*2.2);background:repeating-linear-gradient(-45deg,#FFCD11 0 calc(var(--u)*2.2),#111 calc(var(--u)*2.2) calc(var(--u)*4.4));background-size:calc(var(--u)*6.2) 100%}
.top{top:0}.bot{bottom:0}
.scene{position:absolute;inset:calc(var(--u)*4) 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;padding:0 calc(var(--u)*6)}
.tag{background:#FFCD11;color:#111;font-weight:900;letter-spacing:calc(var(--u)*.25);font-size:calc(var(--u)*2.3);padding:calc(var(--u)*.8) calc(var(--u)*2);border-radius:calc(var(--u)*.6);text-transform:uppercase;margin-bottom:calc(var(--u)*3)}
.big{white-space:nowrap;font-weight:900;font-size:calc(var(--u)*19);line-height:.95;letter-spacing:calc(var(--u)*-.8);color:#FFCD11;text-transform:uppercase}
.big.w{color:#fff}
.mid{font-weight:900;font-size:calc(var(--u)*8.5);line-height:1;letter-spacing:calc(var(--u)*-.3);text-transform:uppercase}
.mid em{font-style:normal;color:#FFCD11}
.lab{margin-top:calc(var(--u)*2.2);font-weight:800;font-size:calc(var(--u)*5);letter-spacing:calc(var(--u)*.1);text-transform:uppercase}
.logo{display:flex;align-items:center;gap:calc(var(--u)*2);margin-top:calc(var(--u)*4)}
.logo .i{width:calc(var(--u)*9);height:calc(var(--u)*9)}
.logo .t{font-weight:900;font-size:calc(var(--u)*5.5);line-height:.95;text-align:left}
.logo .t b{display:block;color:#FFCD11;font-size:calc(var(--u)*2.2);letter-spacing:calc(var(--u)*.7);font-weight:800;margin-top:calc(var(--u)*.4)}
.prog{position:absolute;left:0;bottom:calc(var(--u)*2.2);height:calc(var(--u)*.7);background:#FFCD11;width:0}
</style></head><body><div class="stage" id="st">
<div class="stripe top" id="s1"></div><div class="stripe bot" id="s2"></div>
<div class="scene" id="sc0"><div class="tag">What my own system brought</div><div class="mid">Real results.<br><em>Real machines.</em></div></div>
<div class="scene" id="sc1"><div class="big" id="n1">0</div><div class="lab">Inquiries</div></div>
<div class="scene" id="sc2"><div class="big w" id="n2">0</div><div class="lab">Impressions <span style="color:#FFCD11">a month</span></div></div>
<div class="scene" id="sc3"><div class="tag">Machine requests</div><div class="mid" style="margin-bottom:calc(var(--u)*1.5)">Up to</div><div class="big" style="font-size:calc(var(--u)*17)">500-ton</div></div>
<div class="scene" id="sc4"><div class="mid">Now I build it<br><em>for you.</em></div><div class="logo"><div class="i" id="ic"></div><div class="t">HEAVY<b>ACQUISITION</b></div></div></div>
<div class="prog" id="pg"></div>
</div>
<script>
const ICON=`__ICON__`;document.getElementById('ic').innerHTML=ICON;
const SC=[[0,2.4],[2.4,5.0],[5.0,7.6],[7.6,10.0],[10.0,13.0]];const DUR=13;
const eo=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
const back=t=>{t=Math.min(Math.max(t,0),1);const c=1.8;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function fmt(n,k){return k?Math.round(n).toLocaleString('en-US'):Math.round(n)}
window.seek=function(t){
 SC.forEach(([a,b],i)=>{const el=document.getElementById('sc'+i);
  const tin=(t-a)/0.45, tout=(b-t)/0.3;
  let o=Math.min(eo(tin),i==4?1:eo(tout));if(t<a||t>b)o=0;
  const y=(1-eo(tin))*6, s=0.9+0.1*back(tin);
  el.style.opacity=o;el.style.transform=`translateY(calc(var(--u)*${y.toFixed(3)})) scale(${s.toFixed(4)})`;});
 const c1=eo((t-2.4-0.2)/1.4), c2=eo((t-5.0-0.2)/1.5);
 document.getElementById('n1').textContent=fmt(289*c1,0)+'+';
 document.getElementById('n2').textContent=fmt(20000*c2,1)+'+';
 document.getElementById('s1').style.backgroundPositionX=`calc(var(--u)*${(t*6).toFixed(3)})`;
 document.getElementById('s2').style.backgroundPositionX=`calc(var(--u)*${(-t*6).toFixed(3)})`;
 document.getElementById('pg').style.width=(100*Math.min(t/DUR,1)).toFixed(2)+'%';
};
window.seek(0);
</script></body></html>
